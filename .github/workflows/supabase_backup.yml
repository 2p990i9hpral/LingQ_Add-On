name: Supabase Central Tables Backup to Supabase Storage

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  schedule:
    - cron: '0 18 * * *' # Runs daily at 18:00 UTC (03:00 KST)

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> $GITHUB_PATH

      - name: Dump Central Tables from Supabase
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || vars.DATABASE_URL }}
        run: |
          set -e
          BACKUP_DATE=$(date +'%Y-%m-%d_%H%M%S')
          BACKUP_FILENAME="supabase_central_${BACKUP_DATE}.sql.gz"
          echo "BACKUP_FILENAME=${BACKUP_FILENAME}" >> $GITHUB_ENV

          echo "Starting dump for word_data_central and llm_usage_logs_central..."
          /usr/lib/postgresql/17/bin/pg_dump "${DATABASE_URL}" \
            --no-owner \
            --no-acl \
            -t public.word_data_central \
            -t public.llm_usage_logs_central \
            | gzip > "${BACKUP_FILENAME}"

          FILE_SIZE=$(ls -lh "${BACKUP_FILENAME}" | awk '{print $5}')
          echo "Backup completed successfully. File: ${BACKUP_FILENAME} (${FILE_SIZE})"

          # Verify dump is not empty
          RAW_SIZE=$(wc -c < "${BACKUP_FILENAME}")
          if [ "$RAW_SIZE" -le 100 ]; then
            echo "Error: Database dump file is too small (${RAW_SIZE} bytes). Dump likely failed."
            exit 1
          fi

      - name: Upload to Supabase Storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID || vars.SUPABASE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY || vars.SUPABASE_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.SUPABASE_REGION || secrets.SUPABASE_REGION || 'ap-northeast-2' }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || vars.SUPABASE_PROJECT_REF }}
          BUCKET_NAME: ${{ secrets.SUPABASE_BUCKET_NAME || vars.SUPABASE_BUCKET_NAME }}
        run: |
          set -e
          ENDPOINT_URL="https://${PROJECT_REF}.storage.supabase.co/storage/v1/s3"

          echo "Uploading ${BACKUP_FILENAME} to Supabase Storage (${BUCKET_NAME})..."
          aws s3 cp "${BACKUP_FILENAME}" "s3://${BUCKET_NAME}/${BACKUP_FILENAME}" \
            --endpoint-url "${ENDPOINT_URL}"

          echo "Upload complete! Verifying bucket contents:"
          aws s3 ls "s3://${BUCKET_NAME}/" \
            --endpoint-url "${ENDPOINT_URL}"

          rm -f "${BACKUP_FILENAME}"

          echo "Cleaning up backups older than 30 days..."
          THRESHOLD_DATE=$(date -d "30 days ago" +'%Y-%m-%d')
          aws s3 ls "s3://${BUCKET_NAME}/" --endpoint-url "${ENDPOINT_URL}" \
            | awk '{print $4}' \
            | while read -r filename; do
                [ -z "$filename" ] && continue
                if [[ "$filename" =~ supabase_central_([0-9]{4}-[0-9]{2}-[0-9]{2}) ]]; then
                  file_date="${BASH_REMATCH[1]}"
                  if [[ "$file_date" < "$THRESHOLD_DATE" ]]; then
                    echo "Deleting old backup: $filename"
                    aws s3 rm "s3://${BUCKET_NAME}/${filename}" --endpoint-url "${ENDPOINT_URL}"
                  fi
                fi
              done
