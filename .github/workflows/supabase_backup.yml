name: Supabase Central Tables Backup to Cloudflare R2

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  schedule:
    - cron: '0 18 * * *' # Runs daily at 18:00 UTC (03:00 KST)

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> $GITHUB_PATH

      - name: Dump Central Tables from Supabase
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || vars.DATABASE_URL }}
        run: |
          set -e
          BACKUP_DATE=$(date +'%Y-%m-%d_%H%M%S')
          BACKUP_FILENAME="supabase_central_${BACKUP_DATE}.sql.gz"
          echo "BACKUP_FILENAME=${BACKUP_FILENAME}" >> $GITHUB_ENV

          echo "Starting dump for word_data_central and llm_usage_logs_central..."
          /usr/lib/postgresql/17/bin/pg_dump "${DATABASE_URL}" \
            --no-owner \
            --no-acl \
            -t public.word_data_central \
            -t public.llm_usage_logs_central \
            | gzip > "${BACKUP_FILENAME}"

          FILE_SIZE=$(ls -lh "${BACKUP_FILENAME}" | awk '{print $5}')
          echo "Backup completed successfully. File: ${BACKUP_FILENAME} (${FILE_SIZE})"

          # Verify dump is not empty
          RAW_SIZE=$(wc -c < "${BACKUP_FILENAME}")
          if [ "$RAW_SIZE" -le 100 ]; then
            echo "Error: Database dump file is too small (${RAW_SIZE} bytes). Dump likely failed."
            exit 1
          fi

      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || vars.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || vars.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || vars.R2_BUCKET_NAME }}
        run: |
          set -e
          ENDPOINT_URL="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

          echo "Uploading ${BACKUP_FILENAME} to Cloudflare R2 (${R2_BUCKET_NAME})..."
          aws s3 cp "${BACKUP_FILENAME}" "s3://${R2_BUCKET_NAME}/${BACKUP_FILENAME}" \
            --endpoint-url "${ENDPOINT_URL}"

          echo "Upload complete! Verifying bucket contents:"
          aws s3 ls "s3://${R2_BUCKET_NAME}/" \
            --endpoint-url "${ENDPOINT_URL}"

          rm -f "${BACKUP_FILENAME}"
